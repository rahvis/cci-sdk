[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-sdk"
version = "0.1.0"
description = "Python SDK and standalone statistics engine for Conformal Logit Inference (CLI) — conformal prediction, Venn-Abers calibration, and e-values for LLM decisions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
license-files = ["LICENSE"]
authors = [{ name = "Conformal Logit Inference" }]
keywords = [
  "conformal-prediction",
  "venn-abers",
  "e-values",
  "uncertainty-quantification",
  "llm",
  "calibration",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "numpy>=1.24",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=1.0"]
langchain = ["langchain>=1.0", "langchain-core>=1.0", "langgraph>=1.0"]
langgraph = ["langgraph>=1.0", "langchain-core>=1.0"]
google-adk = ["google-adk>=2.0"]
agent-framework = ["agent-framework-core>=1.19"]
all = [
  "openai>=1.40",
  "anthropic>=1.0",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langgraph>=1.0",
  "google-adk>=2.0",
  "agent-framework-core>=1.19",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.10", "ruff>=0.5"]

[project.urls]
Documentation = "https://docs.cli.dev"
Repository = "https://github.com/cli-inference/cli"

[project.scripts]
cli = "cli_sdk.cli_tool:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
